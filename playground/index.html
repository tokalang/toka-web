<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'">
    <title>Toka Validator Playground</title>
    <!-- CodeMirror is packaged with this site; no third-party runtime code is fetched. -->
    <link rel="stylesheet" href="vendor/codemirror.css">
    <link rel="stylesheet" href="vendor/material-darker.css">
    <link rel="stylesheet" href="vendor/lint.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo-area">
                <div class="logo-icon">T</div>
                <h1>Toka Playground <span>Validator</span></h1>
            </div>
            <div class="controls">
                <select id="example-select" class="glass-select">
                    <option value="hello">Hello World</option>
                    <option value="smart_ptr">Shared Smart Pointer (~)</option>
                    <option value="shape_match">Shape & Pattern Matching</option>
                    <option value="async_demo">Async Coroutines</option>
                </select>
                <button id="check-btn" class="glow-btn">Check Syntax</button>
                <button id="run-btn" class="glow-btn run-btn" disabled>Run Code</button>
            </div>
        </header>

        <main class="workspace">
            <div class="editor-pane">
                <textarea id="code-editor"></textarea>
            </div>
            <div class="output-pane">
                <div class="output-header">
                    <h3>Diagnostics</h3>
                    <div class="status-group">
                        <div id="status-indicator" class="status-indicator">Loading Compiler...</div>
                        <div id="runner-indicator" class="status-indicator status-disconnected">Runner: Offline</div>
                    </div>
                </div>
                <div id="terminal" class="terminal-view">
                    <!-- Errors will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="vendor/codemirror.js"></script>
    <script src="vendor/simple.js"></script>
    <script src="vendor/lint.js"></script>
    <!-- Load Toka Mode -->
    <script src="toka_mode.js"></script>
    <!-- Load WebAssembly API -->
    <script src="tokacheck.js"></script>
    <!-- Main App -->
    <script src="app.js"></script>
</body>
</html>
